# Desk Portal vhosts for a host whose nginx already serves other sites.
# Copy to /etc/nginx/sites-available/piomanage, symlink into sites-enabled, reload.
# TLS: run `certbot --nginx -d piomanage.com -d auth.piomanage.com` once DNS resolves —
# it rewrites these blocks for 443 itself.

server {
    listen 80;
    listen [::]:80;
    server_name piomanage.com;

    # Attachment uploads pass through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.piomanage.com;
    return 301 https://piomanage.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.piomanage.com;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        # Keycloak runs with --proxy-headers=xforwarded and KC_HOSTNAME set to the
        # public URL; these headers are how it knows the request's real origin.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
